name: omomp-check

on:
  workflow_call:
    inputs:
      mode:
        description: "`bun` runs install, check, test and the copy comparison; `copies` runs only the copy comparison."
        type: string
        default: bun

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            bun|copies) echo "omomp-check: mode $MODE" ;;
            *) echo "omomp-check: unknown mode '$MODE'; expected bun or copies" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@main
        with:
          path: repository
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@main
        with:
          bun-version: latest

      - name: Install dependencies (frozen bun.lock)
        if: inputs.mode == 'bun'
        working-directory: repository
        run: bun install --frozen-lockfile

      - name: Check
        if: inputs.mode == 'bun'
        working-directory: repository
        run: bun run check

      - name: Test
        if: inputs.mode == 'bun'
        working-directory: repository
        run: bun run test

      - uses: actions/checkout@main
        with:
          repository: oh-my-omp/shared
          ref: main
          path: omomp-shared
          persist-credentials: false

      - name: Compare shared copies
        run: bun omomp-shared/verify.ts repository
